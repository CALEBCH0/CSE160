<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSE160</title>
  <style>
    #canvas-container {
      position: relative;
      width: 800px;
      height: 600px;
      margin: 20px auto;
      border: 1px solid #444;
    }

    #webgl {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      margin-top: -10px;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }

    #crosshair::before {
      top: 9px;
      left: 0;
      right: 0;
      height: 2px;
    }

    #crosshair::after {
      left: 9px;
      top: 0;
      bottom: 0;
      width: 2px;
    }
  </style>
</head>
<body onload="main()">
  <h1 style="text-align:center">ASGN 4</h1>
  <div style="text-align:center">
    <p>Caleb Cho gacho@ucsc.edu</p>
  <p>Controls: move: wasd, pan: qr</p>
  <p>Right click and drag to move camera</p>
  <p>Left click to destroy/place blocks</p>
  <p>Press m to reset meteor</p>
  </div>
  
  <div id="canvas-container">
    <canvas id="webgl" width="800" height="600"></canvas>
    <div id="crosshair"></div>
  </div>

  <div class="controls">
    <p id="numdot"> XXX </p>
    <p>
      Camera Angle
      <input type="range" id="angleSlide" min="-180" max="180" value="0" step="1" class="slider"
             oninput="document.getElementById('angleSlideValue').textContent=this.value">
      <span id="angleSlideValue" class="value">0</span>°      
      <input type="range" id="volumeSlide" min="0" max="100" value="30" step="1" class="slider"
             oninput="
             document.getElementById('bgm').volume=this.value/100; 
             document.getElementById('meteorSound').volume=this.value/100">
      <span id="volumeSlideValue" class="value">30</span>%
    </p>
    <p>
      <button onclick="toggleMeteor()">Toggle Meteor</button>
    </p>
    <p>
      <button onclick="toggleNormalView()">Toggle Normals</button>
      <button onclick="toggleLighting()">Toggle Lighting</button>
      <button onclick="toggleSpotlight()">Toggle Spotlight</button>
    </p>
    <p>
      <label for="lightHeight">Light Height</label>
      <input type="range" id="lightHeight" min="0" max="10" step="0.1" value="5">
    </p>
  </div>

  <script src="../lib/cuon-matrix-cse160.js"></script>
  <script src="../lib/OBJLoader.js"></script>
  <!-- <script src="../lib/cuon-utils.js"></script> -->
  <script src="Triangle.js"></script>
  <script src="Cube.js"></script>
  <script src="Sphere.js"></script>
  <script src="Camera.js"></script>
  <script src="Model.js"></script>
  <script src="main.js"></script>
  <audio id="bgm" src="../resources/wethands.mp3" loop></audio>
  <audio id="meteorSound" src="../resources/meteor.mp3"></audio>
</body>
</html>
